finders_facets.finders_facet_type.*:
  type: config_entity
  label: Finders Facet Type
  mapping:
    id:
      type: text
      label: Machine name
    label:
      type: label
      label: Name
    weight:
      type: weight
      label: Weight
    description:
      type: text
      label: 'Description of facet type'

# Schema for Finders Facets third party settings on finder entities.
finders.finder.third_party.finders_facets:
  type: mapping
  label: 'Third party settings'
  mapping:
    facets:
      type: boolean
      label: 'Enable facets'
