services:
  finders_facets.bundle_config_form_facets:
    class: Drupal\finders_facets\BundleConfigFormFacets
    decorates: Drupal\finders\BundleConfigForm
    arguments: ['@.inner']

  Drupal\finders_facets\Hook\FindersFacetsHooks:
    class: Drupal\finders_facets\Hook\FindersFacetsHooks
    autowire: true

  finders_facets.event_subscriber:
    class: Drupal\finders_facets\EventSubscriber\FindersFacetsConfigSubscriber
    arguments: ['@config.storage', '@config.storage.sync']
    tags:
      - { name: event_subscriber }
