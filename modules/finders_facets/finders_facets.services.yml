services:
  plugin.manager.finders_facets_type:
    class: Drupal\finders_facets\FindersFacetsTypeManager
    parent: default_plugin_manager
  Drupal\finders_facets\FindersFacetsTypeManager: '@plugin.manager.finders_facets_type'

  # @todo Remove hook services definitions when support for Drupal core < 11.1
  # is dropped.
  Drupal\finders_facets\Hook\FindersHooks:
    class: Drupal\finders_facets\Hook\FindersHooks
    autowire: true

  Drupal\finders_facets\Hook\FacetsHooks:
    class: Drupal\finders_facets\Hook\FacetsHooks
    autowire: true

  Drupal\finders_facets\Hook\FormAlterHooks:
    class: Drupal\finders_facets\Hook\FormAlterHooks
    autowire: true

  Drupal\finders_facets\Hook\WidgetAlterHooks:
    class: Drupal\finders_facets\Hook\WidgetAlterHooks
    autowire: true

  finders_facets.event_subscriber:
    class: Drupal\finders_facets\EventSubscriber\FindersFacetsConfigSubscriber
    arguments: ['@config.storage', '@config.storage.sync']
    tags:
      - { name: event_subscriber }
